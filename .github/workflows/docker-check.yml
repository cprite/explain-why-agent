name: Docker check

on:
  push:
  pull_request:

jobs:
  docker-check:
    # Plan check P (tasks 21+22): "clean clone, docker build, docker run, curl /run works" in sample mode.
    # The image is built from a fresh checkout and started with SAMPLE_MODE=true and nothing else (no .env,
    # no --env-file); the three input_examples are posted with curl and every answer must be HTTP 200 and
    # a schema-valid result. A second container with the network off answers example 1 as well, so the
    # start command needs nothing from the network.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: "Clean clone (for plan check P): check out the branch into a fresh directory"
        uses: actions/checkout@v4
        with:
          path: docker-check
      - name: "Plan check P: docker build -t explain-why-agent ."
        working-directory: docker-check
        run: |
          test ! -e .env && echo "no .env in the checkout"
          timeout 600 docker build -t explain-why-agent .
          docker image ls explain-why-agent
      - name: "Plan check P: docker run with SAMPLE_MODE=true, wait for GET /health (max 60 s)"
        run: |
          docker run -d --name ewa -p 8000:8000 -e SAMPLE_MODE=true explain-why-agent
          for i in $(seq 1 60); do
            if curl -s --max-time 2 localhost:8000/health; then echo; echo "healthy after ${i} s"; break; fi
            if [ "$i" = 60 ]; then echo "container not healthy after 60 s"; docker logs ewa; exit 1; fi
            sleep 1
          done
      - name: "Plan check P: curl POST /run with input_examples/example_{1,2,3}.json (HTTP 200, schema-valid result)"
        working-directory: docker-check
        run: |
          status=0
          for n in 1 2 3; do
            code=$(curl -s --max-time 300 -o /tmp/response-$n.json -w '%{http_code}' -X POST http://localhost:8000/run \
              -H "Content-Type: application/json" -d @input_examples/example_$n.json) || code="curl-failed"
            echo "--- example_$n: HTTP $code, response (first 1500 bytes) ---"
            head -c 1500 /tmp/response-$n.json 2>/dev/null; echo
            if [ "$code" != 200 ]; then echo "[FAIL] example_$n: HTTP $code"; status=1; continue; fi
            # Validated with the image's own app.schemas, so the runner needs no Python dependencies.
            docker exec -i ewa python -c '
          import sys
          from app.schemas import Result
          r = Result.model_validate_json(sys.stdin.read())
          assert r.status == "success" and r.sample_mode is True, (r.status, r.sample_mode, r.error)
          if sys.argv[1] == "3":
              assert r.determinable is False and not r.causes, "example 3 must be undeterminable with no cause"
          print(f"[PASS] example_{sys.argv[1]}: schema-valid Result, status={r.status}, determinable={r.determinable}, causes={[c.type for c in r.causes]}")
          ' "$n" < /tmp/response-$n.json || status=1
          done
          exit $status
      - name: "Plan check P: the same image with the network off (docker run --network none) answers example 1"
        working-directory: docker-check
        run: |
          docker run -d --name ewa-offline --network none -e SAMPLE_MODE=true explain-why-agent
          docker exec -i ewa-offline python -c '
          import json, sys, time, urllib.request
          for i in range(60):
              try:
                  urllib.request.urlopen("http://127.0.0.1:8000/health", timeout=2)
                  break
              except OSError:
                  if i == 59:
                      sys.exit("not healthy after 60 s")
                  time.sleep(1)
          req = urllib.request.Request("http://127.0.0.1:8000/run", data=sys.stdin.buffer.read(),
                                       headers={"Content-Type": "application/json"})
          with urllib.request.urlopen(req, timeout=300) as resp:
              code, body = resp.status, json.load(resp)
          status, causes = body["status"], [c["type"] for c in body["causes"]]
          assert code == 200 and status == "success", (code, status, body.get("error"))
          print(f"[PASS] network none: HTTP {code}, status={status}, causes={causes}")
          ' < input_examples/example_1.json
      - name: "docker logs and stop"
        if: always()
        run: |
          for c in ewa ewa-offline; do
            echo "--- docker logs $c ---"
            docker logs "$c" 2>&1 | tail -n 100 || true
            docker stop -t 5 "$c" >/dev/null 2>&1 || true
          done
