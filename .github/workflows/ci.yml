name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q
      - name: "Plan check A: data adapter (cross-source join, rejected write)"
        run: python -m app.data.check
      - name: "Plan check B: generator stub suite and example-result validation"
        run: python -m app.llm.check
      - name: "Plan check C: sample-mode run.py on the Day 1 question (cause, evidence, trace)"
        env:
          SAMPLE_MODE: "true"
        run: |
          set -o pipefail
          python run.py "Why did order volume spike on 24 November 2017?" --run-id ci-day1 | tee /tmp/result-ci-day1.json
          python scripts/check_result.py /tmp/result-ci-day1.json
          echo "--- logs/trace-ci-day1.jsonl (first 3 lines) ---"
          head -n 3 logs/trace-ci-day1.jsonl
      - name: "Plan check D: evaluation against the answer key in sample mode (score reported, not gated)"
        env:
          SAMPLE_MODE: "true"
        run: |
          set -o pipefail
          python eval/run_eval.py --sample | tee /tmp/eval.txt
          tail -n 1 /tmp/eval.txt | grep -E '^Score: [0-9]+/[0-9]+ \(answered [0-9]+, no_cache [0-9]+, errors [0-9]+\)$'
          echo "--- $(ls logs/eval-*.json) ---"
          python -c "import json,glob; r=json.load(open(sorted(glob.glob('logs/eval-*.json'))[-1])); print({i['id']: (i['status'], i['run_id']) for i in r['incidents']})"
