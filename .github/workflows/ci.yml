name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q
      - name: "Plan check A: data adapter (cross-source join, rejected write)"
        run: python -m app.data.check
      - name: "Plan check B: generator stub suite and example-result validation"
        run: python -m app.llm.check
      - name: "Plan check C: sample-mode run.py on the Day 1 question (cause, evidence, trace)"
        # Pinned to the simple loop: the recorded Day 1 cache holds that loop's prompts (Sprint 8 note).
        env:
          SAMPLE_MODE: "true"
          LOOP: simple
        run: |
          set -o pipefail
          python run.py "Why did order volume spike on 24 November 2017?" --run-id ci-day1 --loop simple | tee /tmp/result-ci-day1.json
          python scripts/check_result.py /tmp/result-ci-day1.json
          echo "--- logs/trace-ci-day1.jsonl (first 3 lines) ---"
          head -n 3 logs/trace-ci-day1.jsonl
      - name: "Plan check D (task 10): Day 1 queries through the Zetaris adapter (recorded REST responses) vs local DuckDB"
        run: |
          python scripts/zetaris_fixture_status.py
          pytest -s -q -rs tests/test_zetaris_plan_check.py
      - name: "Plan check D (task 7): same observation written twice is one record, log shows a no-op"
        run: pytest -q -s tests/test_world_store.py::test_plan_check_task7_same_observation_twice_is_one_record
      - name: "Plan check E (task 8): interrupted ingest resumes from its checkpoint, no duplicates"
        run: pytest -q -s tests/test_world_ingest.py::test_plan_check_task8_interrupted_ingest_resumes_without_duplicates
      - name: "World Model sample ingest, run twice: entity and edge counts must be identical"
        env:
          SAMPLE_MODE: "true"
          WORLD_DB_PATH: logs/world-ci.db
        run: |
          set -o pipefail
          python -m app.engines.world_model.ingest --sample | tee /tmp/ingest-1.txt
          python -m app.engines.world_model.ingest --sample | tee /tmp/ingest-2.txt
          grep '^COUNTS ' /tmp/ingest-1.txt > /tmp/counts-1.txt
          grep '^COUNTS ' /tmp/ingest-2.txt > /tmp/counts-2.txt
          diff /tmp/counts-1.txt /tmp/counts-2.txt && echo "[PASS] counts identical on both runs"
      - name: "Plan check F (task 9): critique payload within budget with supporting and refuting evidence"
        run: pytest -q -s tests/test_world_context.py::test_plan_check_task9_critique_has_support_and_refutation_within_budget
      - name: "World Model sample context: critique payload"
        env:
          SAMPLE_MODE: "true"
          WORLD_DB_PATH: logs/world-ci.db
        run: python -m app.engines.world_model.context --sample --intent critique
      - name: "Plan check G (task 11): Markovian carryover cascade (step used and used/budget chars per case)"
        run: |
          set -o pipefail
          pytest -q -s -p no:cacheprovider tests/test_markovian_carryover.py | tee /tmp/markovian-plan-check.log
          echo "--- plan check summary ---"
          grep "PLAN-CHECK" /tmp/markovian-plan-check.log
      - name: "Plan check H (task 11): Markovian carryover sample mode (recorded round, stub generator)"
        run: python -m app.engines.markovian.carryover --sample

      - name: "Plan check I (task 18): HTTP API in sample mode (POST /run, GET /runs/{id}, schema validation)"
        env:
          SAMPLE_MODE: "true"
          LOOP: simple  # posts the Day 1 question, recorded for the simple loop
        run: |
          set -o pipefail
          python -m app.api > /tmp/api-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -s --max-time 2 localhost:8000/health; then echo; break; fi
            if [ "$i" = 30 ]; then echo "server not healthy after 30 s"; cat /tmp/api-server.log; exit 1; fi
            sleep 1
          done
          curl -sS --max-time 120 -X POST localhost:8000/run \
            -H 'Content-Type: application/json' \
            -d '{"input":{"query":"Why did order volume spike on 24 November 2017?"},"options":{"sample_mode":true}}' \
            | tee /tmp/api-result.json
          echo
          python -m app.schemas /tmp/api-result.json
          python scripts/check_result.py /tmp/api-result.json
          RUN_ID=$(python -c 'import json; print(json.load(open("/tmp/api-result.json"))["run_id"])')
          curl -sS --max-time 10 -f -o /tmp/api-stored.json "localhost:8000/runs/$RUN_ID"
          curl -sS --max-time 10 -f -o /tmp/api-trace.jsonl "localhost:8000/runs/$RUN_ID/trace"
          python -c 'import json, sys; a, b = (json.load(open(f)) for f in sys.argv[1:]); assert a == b, "GET /runs/{id} differs from POST /run"; print("[PASS] GET /runs/" + a["run_id"] + " returns the POST /run result")' /tmp/api-result.json /tmp/api-stored.json
          echo "--- GET /runs/$RUN_ID/trace: $(wc -l < /tmp/api-trace.jsonl) lines, first 2 ---"
          head -n 2 /tmp/api-trace.jsonl
          kill $SERVER_PID
          echo "--- server log ---"
          cat /tmp/api-server.log
      - name: "Plan check J (task 12): Markovian orchestrator in sample mode (elapsed, chunks used / max_chunks, stop_reason, top cause)"
        env:
          SAMPLE_MODE: "true"
        run: |
          set -o pipefail
          start=$(date +%s)
          timeout 600 python run.py "Why did delivery lateness spike for deliveries completed the week of 28 May 2018?" --sample --run-id ci-plan-check-j | tee /tmp/result-ci-plan-check-j.json
          echo "wall_clock_seconds: $(( $(date +%s) - start ))"
          python scripts/check_markovian_run.py /tmp/result-ci-plan-check-j.json --max-seconds 600

      - name: "Plan check L: evaluation against the answer key in sample mode (score gated on the committed after score)"
        # Since Sprint 11c the eval follows LOOP (the Markovian orchestrator by default, as run.py) and the
        # score must equal the newest committed logs/eval-after-*.json (reported only while none is committed).
        env:
          SAMPLE_MODE: "true"
        run: |
          set -o pipefail
          python eval/run_eval.py --sample | tee /tmp/eval.txt
          tail -n 1 /tmp/eval.txt | grep -E '^Score: [0-9]+/[0-9]+ \(answered [0-9]+, no_cache [0-9]+, errors [0-9]+\)$'
          python scripts/check_eval_score.py /tmp/eval.txt
          echo "--- $(ls logs/eval-[0-9]*.json) ---"
          python -c "import json,glob; r=json.load(open(sorted(glob.glob('logs/eval-[0-9]*.json'))[-1])); print({i['id']: (i['status'], i['run_id']) for i in r['incidents']})"

      - name: "Plan check N (tasks 13+14): Critic verdicts and the three branches in sample mode"
        # Was a second "Plan check L" (PR #28); N since Sprint 10b (L is the eval step, M is PR #30's).
        # Questions are read from eval/answer_key.json (incident-06, -09, -10), not retyped. The fourth is a
        # day of normal order volume (21 Sep 2017: 111 orders against 106.9 a day, spread 17.7).
        env:
          SAMPLE_MODE: "true"
        run: |
          set -o pipefail
          echo "--- (a) incident-06: the Critic judges every hypothesis; delivery delay is refuted ---"
          python run.py "$(python scripts/check_critic_run.py --question incident-06)" --sample --run-id ci-plan-check-n-06 > /tmp/result-n-06.json
          python scripts/check_critic_run.py /tmp/result-n-06.json --expect refuted:logistics_delay
          for id in 09 10; do
            echo "--- (b) incident-$id: cannot be determined, no cause ---"
            python run.py "$(python scripts/check_critic_run.py --question incident-$id)" --sample --run-id ci-plan-check-n-$id > /tmp/result-n-$id.json
            python scripts/check_critic_run.py /tmp/result-n-$id.json --expect undeterminable
          done
          echo "--- (c) a change within normal variation: significant false, no causes ---"
          python run.py "Why did order volume rise on 21 September 2017?" --sample --run-id ci-plan-check-n-no-change > /tmp/result-n-no-change.json
          python scripts/check_critic_run.py /tmp/result-n-no-change.json --expect no-change

  readme-quickstart:
    # Plan check O (task 23): "a second person can run it from the README alone". The branch is checked
    # out into a fresh directory with an empty .env, and the ```bash readme-quickstart``` block of
    # README.md is extracted and run as written (venv, pip install, sample-mode run.py).
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: "README quick start (for plan check O): check out the branch into a fresh directory"
        uses: actions/checkout@v4
        with:
          path: readme-check
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: "Plan check O (task 23): README quick start block run from the fresh checkout, empty .env, SAMPLE_MODE=true"
        working-directory: readme-check
        run: |
          : > .env
          echo ".env is $(wc -c < .env) bytes"
          python3 scripts/readme_quickstart.py --run --timeout 1080
