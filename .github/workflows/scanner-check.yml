name: Scanner plan check

on:
  push:
  pull_request:

jobs:
  scanner-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Scanner plan check (sample mode)
        env:
          SAMPLE_MODE: "true"
          SCANNER_TIMEOUT_S: "300"
        run: python eval/scanner_check.py
