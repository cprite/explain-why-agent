name: Browser check

on:
  push:
  pull_request:

jobs:
  browser-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies and headless Chromium
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          python -m playwright install --with-deps chromium
      - name: "Plan check K (task 19): web page in sample mode (board, Show more, cache_miss, Day-1 answer)"
        env:
          SAMPLE_MODE: "true"
        run: |
          set -o pipefail
          python -m app.api > /tmp/web-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -s --max-time 2 localhost:8000/health; then echo; break; fi
            if [ "$i" = 30 ]; then echo "server not healthy after 30 s"; cat /tmp/web-server.log; exit 1; fi
            sleep 1
          done
          status=0
          timeout 600 python eval/browser_check.py || status=$?
          echo "--- server log ---"
          cat /tmp/web-server.log
          exit $status
      - name: Upload the screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-check
          path: browser-check.png
          if-no-files-found: warn
